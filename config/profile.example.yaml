# ApplyFlow profile
# -----------------
# Copy this file to config/profile.yaml and edit it. profile.yaml is gitignored,
# so your personal details never end up in the repository.
#
# Everything the pipeline decides (which roles count, how they're scored, which
# tier they land in) comes from this file. When your resume changes - say you add
# a Spring Boot project - update the skills here and re-run `applyflow score`.

candidate:
  name: "Your Name"
  email: "you@example.com"          # used later as the sender; optional for Step 1
  resume_url: "https://example.com/your-resume.pdf"   # hosted PDF link, used in Phase 2 email signatures
  graduation: "2027-05"
  internship_available_from: "2027-01"
  # Optional: identifies you in the HTTP User-Agent so site operators can reach you.
  contact_for_user_agent: ""
  # Shown in Phase 2 email signatures. Placeholders only here; real values go in profile.yaml.
  phone: "+91 90000 00000"
  linkedin_url: "https://www.linkedin.com/in/your-handle/"
  github_url: "https://github.com/your-username"
  # Phase 2b: the ONLY facts email drafts may use. Numbers and tech terms in a draft must appear
  # somewhere in this block (or in the company's own posting / site text), or the draft fails
  # validation. Sample values below - replace every one with your own.
  facts:
    first_name: "Your"
    degree_short: "B.Tech CS"
    college_short: "Example University"
    signature_title: "B.Tech CS, Example University (2027)"
    education: "B.Tech in Computer Science, Example University, 2023 - 2027"
    graduation: "May 2027"
    internship: "a 6-month internship from January 2027"
    full_time: "a full-time new-grad role from mid-2027"
    focus: "backend systems and REST APIs"
    coursework: "Data Structures & Algorithms, Operating Systems, DBMS, Computer Networks"
    skills: [Python, FastAPI, Flask, REST APIs, PostgreSQL, MongoDB, AWS, AWS Lambda, S3, DynamoDB, React, Git]
    experience:
      - name: "summer research internship"
        role: "summer research intern"
        org: "Example Research Lab"
        org_short: "Example Research Lab"
        short: "Example Research Lab"     # used in the one-line credentials sentence
        when: "May-Jun 2025"
        detail: "compared three scheduling approaches for a lab network and documented the trade-offs"
    patent:
      title: ""             # leave empty if you have none
      published: ""
      short: ""             # e.g. "Android attention management"
      detail: ""
    projects:               # lead_project names in role_families refer to these
      - name: "CareerForge AI"
        stack: "React, FastAPI, PostgreSQL"
        detail: "a full-stack web app with 12 REST endpoints and 40+ automated API tests"
        keywords: [backend, api, python, product, platform]
      - name: "Judicial AI System"
        stack: "Python, Flask, Neo4j"
        detail: "an NLP pipeline over 1,000+ documents with a Neo4j graph of the extracted entities"
        keywords: [ai, nlp, llm, ml, data, graph, agent]
      - name: "Serverless FileFinder"
        stack: "AWS Lambda, S3, DynamoDB"
        detail: "a serverless file service on 6 AWS Lambda functions with DynamoDB metadata search"
        keywords: [cloud, aws, serverless, infrastructure, payments, fintech]

# ---------------------------------------------------------------------------
# Tracks: which kinds of openings you want.
# ---------------------------------------------------------------------------
tracks:
  internship: true
  new_grad: true
  # Roles that mention neither internship nor new-grad (e.g. plain "Software
  # Engineer") are kept but scored lower, since many are secretly mid-level.
  unspecified: true

# ---------------------------------------------------------------------------
# Role families. Tier weight multiplies the skill score.
#   primary   = where your resume is strongest
#   secondary = good fit, slightly different pitch
#   stretch   = test with a small batch, let reply data decide
# Patterns are matched case-insensitively against the job title (first) and
# then the description. Order matters: the first family that matches wins.
# ---------------------------------------------------------------------------
role_families:
  - name: ai_application
    tier: secondary
    title_patterns: ["ai engineer", "applied ai", "llm", "genai", "gen ai", "generative ai", "ai/ml engineer", "ai developer", "agentic", "ai agents", "ai platform"]
    lead_project: "Judicial AI System"
  - name: cloud
    tier: primary
    title_patterns: ["cloud engineer", "serverless", "cloud developer", "aws engineer"]
    lead_project: "Serverless FileFinder"
  - name: backend
    tier: primary
    title_patterns: ["backend", "back-end", "back end", "python developer", "python engineer", "api engineer", "server engineer", "node.js developer", "nodejs developer"]
    lead_project: "CareerForge AI"
  - name: fullstack
    tier: secondary
    title_patterns: ["full stack", "full-stack", "fullstack"]
    lead_project: "CareerForge AI"
  - name: ml
    tier: stretch
    title_patterns: ["machine learning", "ml engineer", "nlp", "mlops"]
    lead_project: "Judicial AI System"
  - name: data
    tier: stretch
    title_patterns: ["data engineer", "analytics engineer", "etl"]
    lead_project: "Judicial AI System"
  - name: platform
    tier: stretch
    title_patterns: ["devops", "site reliability", "sre", "platform engineer", "infrastructure engineer"]
    lead_project: "Serverless FileFinder"
  - name: sde_generic
    tier: primary
    title_patterns: ["software engineer", "software developer", "software development engineer", "sde", "swe", "member of technical staff", "product engineer", "developer", "engineer intern", "engineering intern", "programmer"]
    lead_project: "CareerForge AI"

family_tier_weights:
  primary: 1.0
  secondary: 0.85
  stretch: 0.6

# ---------------------------------------------------------------------------
# Title filters. Matched as whole words, case-insensitive.
# ---------------------------------------------------------------------------
title_exclude:
  - senior
  - sr
  - lead
  - staff
  - principal
  - intermediate
  - mid-level
  - mid level         # also matches "mid-level"
  - experienced
  - architect
  - manager
  - director
  - head of
  - vp
  - sde 2
  - sde ii
  - sde-2
  - sde-ii
  - sde iii
  - sde 3
  - sde iv
  - engineer ii
  - engineer iii
  - engineer 2
  - engineer 3
  - frontend
  - front-end
  - front end
  - android
  - ios
  - mobile
  - data scientist
  - research scientist
  - embedded
  - firmware
  - hardware
  - qa
  - test engineer
  - sdet
  - solutions engineer
  - solution engineer
  - sales engineer
  - support engineer
  # security roles aren't a target
  - security engineer
  - application security
  - appsec
  - infosec
  - penetration
  - security analyst
  # developer relations isn't an engineering-track fresher role
  - developer relations
  - devrel
  - developer advocate
  - evangelist

# ---------------------------------------------------------------------------
# Experience. Openings requiring more than this many years are rejected.
# ---------------------------------------------------------------------------
max_years_required: 1

# ---------------------------------------------------------------------------
# Locations. Matching is case-insensitive substring on the location text.
# ---------------------------------------------------------------------------
locations:
  preferred_india: ["bangalore", "bengaluru", "hyderabad", "gurgaon", "gurugram", "delhi", "new delhi", "noida", "ncr"]
  other_india: ["india", "pune", "mumbai", "chennai", "kolkata", "ahmedabad", "jaipur", "kochi", "lucknow"]
  accept_other_india: true
  # Remote roles are accepted when they're open to India or worldwide.
  remote_open_markers: ["india", "anywhere", "worldwide", "global", "apac", "asia"]
  # Remote roles restricted to these regions are rejected.
  remote_restricted_markers: ["us", "usa", "u.s.", "united states", "canada", "north america", "americas", "amer", "europe", "eu", "emea", "uk", "united kingdom", "latam", "australia", "germany", "france"]
  # Onsite roles abroad are only kept when the posting signals visa sponsorship.
  abroad_requires_sponsorship: true

# ---------------------------------------------------------------------------
# Skills, matched as whole words against title + description.
# Weights are relative; negative weights pull a role down.
# ---------------------------------------------------------------------------
skills:
  heavy:            # weight 3
    - python
    - fastapi
    - flask
    - node.js
    - nodejs
    - express
    - rest api
    - rest apis
    - restful
    - api
    - apis
    - aws
    - lambda
    - serverless
    - postgresql
    - postgres
    - microservices
    - backend
  medium:           # weight 2
    - sql
    - mysql
    - mongodb
    - dynamodb
    - s3
    - react
    - javascript
    - java
    - nlp
    - llm
    - llms
    - neo4j
    - sqlalchemy
    - jwt
    - event-driven
    - distributed systems
    - system design
  light:            # weight 1
    - git
    - linux
    - docker
    - cloud
    - typescript
    - machine learning
    - data structures
    - algorithms
  negative:         # weight -3: core requirements you don't have yet
    - golang
    - rust
    - scala
    - kotlin
    - swift
    - spring boot
    - c#
    - .net
    - ruby on rails
    - elixir
  skill_score_cap: 22   # raw points that count as a "perfect" skill match (real JDs name few skills)

# ---------------------------------------------------------------------------
# Scoring thresholds (0-100).
# ---------------------------------------------------------------------------
tiers:
  A: 70
  B: 45
# Only these tracks can reach tier A; an unspecified-track role tops out at B,
# since it may be secretly mid-level.
a_tier_tracks: ["internship", "new_grad"]
# Internship / new-grad roles in a primary family and a preferred city get at least this
# many skill points (of 50): intern JDs often name only a couple of skills. 0 turns it off.
fresher_skill_floor: 25

# ---------------------------------------------------------------------------
# Freshness, from the date the board (re)published the posting.
# ---------------------------------------------------------------------------
freshness:
  stale_days: 120       # older postings lose stale_penalty points
  stale_penalty: 10
  max_age_days: 365     # older postings are rejected as evergreen / abandoned

# Boards with more open jobs than this are treated as large companies:
# apply through their system rather than cold-email.
large_company_job_count: 60

# Recruiting marketplaces post roles for client companies, so emailing them isn't emailing
# the hiring company. Their roles stay in the report with action "apply"; they're never contact
# targets. Postings that say "our client" / "one of our clients" are treated the same way.
recruiting_marketplaces: ["Weekday"]

# ---------------------------------------------------------------------------
# Outreach (Phase 2b): drafts and the daily send queue. ApplyFlow never sends anything:
# you send from Gmail and record it with `mark-sent`.
# ---------------------------------------------------------------------------
outreach:
  daily_batch: 20          # emails picked by `queue` per day
  tier3:                   # guessed addresses (send tier 3), inside the same daily_batch total
    unlock_after_days: 2   # calendar days after the first mark-sent, and only if nothing has bounced
    start_per_day: 5       # tier-3 emails per day once unlocked
    ramp_after_days: 3     # days after the first tier-3 send before the higher limit...
    ramp_per_day: 10       # ...if the overall bounce rate stays under max_bounce_rate
    max_bounce_rate: 0.05  # bounces / sends at or above this pauses tier 3
  min_words: 120           # draft length, counted between the greeting and the sign-off
  max_words: 160

# ---------------------------------------------------------------------------
# Contacts (Phase 2a): who to email at each target company.
# ---------------------------------------------------------------------------
contacts:
  recheck_days: 30          # look a company up again at most this often (unless --force)
  max_site_pages: 5         # pages read on the company's site besides the homepage
  github_max_members: 10    # public org members looked up per company (GitHub allows 60 calls/hour)
  apply_only_team_size: 300 # more people than this (or, size unknown, a board bigger than
                            # large_company_job_count): apply via the posting, no contact search
                            # unless a posting lists an email
  mx_cache_days: 30         # how long a domain's MX lookup is trusted

# ---------------------------------------------------------------------------
# Startups. Smaller teams hire freshers more readily and a cold email reaches
# someone who decides, so startups get a bonus and a founder/CTO contact hint.
# ---------------------------------------------------------------------------
startup:
  max_team_size: 300                  # at or below this headcount counts as a startup
  score_bonus: 6                      # points added to startup openings
  founder_contact_max_team_size: 50   # at or below this, reach out to a founder/CTO
  small_board_job_count: 15           # when headcount is unknown, a board this small suggests a small company

# ---------------------------------------------------------------------------
# Discovery: finding new hiring companies automatically.
# ---------------------------------------------------------------------------
discovery:
  recheck_days: 30                    # re-check a company's job board at most this often
  yc:
    statuses: ["Active"]
    min_team_size: 2
    max_team_size: 1000
    regions_any: ["India"]            # company must be located in one of these ("Remote" alone means US-remote)
    preferred_team_size: [10, 300]    # teams in this range are checked before smaller or larger ones

# Company sources for the Phase 2c outreach pool (`python -m applyflow pool`).
#
# Every page here was checked on 2026-10-19: robots.txt allows it for ApplyFlow's
# User-Agent, and its HTML gives a company name plus the company's own website.
# Fetches go through the polite client (1 request/second/host, robots.txt checked).
#
# Portfolio entries are parsed by one generic collector (sources.parse_portfolio):
#   item:        regex for one company's block in the page (DOTALL)
#   name:        regex, group 1 = the company name (inside the block)
#   website:     regex, group 1 = the company's URL
#   description: optional regex, group 1 = a one-liner
#   location:    optional regex, group 1 = a location label
#   keep:        optional regex the block must match (e.g. an India tag)
#   locations:   locations to record when the page doesn't say (India-only portfolios)
#   pages:       optional {param: "...", max: N} for ?param=N pagination
#
# Sources looked at and skipped (2026-10-19):
#   100X.VC (/portfolio is a 404; the homepage links no companies), Blume (/companies lists names
#   but links each to a blume.vc page, no websites), Speciale Invest (robots.txt disallows
#   /portfolio), Peak XV Surge (company cards carry no website links), Titan Capital, Kae Capital,
#   Kalaari, Stellaris, Nexus, Venture Catalysts (logos / script-rendered, no name + website pairs),
#   Antler India's location page (team bios, not companies; the global portfolio is used instead,
#   filtered to its India tag).

portfolios:
  - id: better-capital
    label: Better Capital portfolio
    url: https://www.bettercapital.vc/portfolio
    item: '<tr class="bg-w">.*?</tr>'
    name: '<a href="[^"]+"[^>]*>([^<]+)</a>'
    website: '<a href="([^"]+)"'
    description: '</td>\s*<td class="border-bottom">(.*?)</td>'
    locations: "India"
  - id: axilor
    label: Axilor Ventures portfolio
    url: https://axilor.com/portfolio/
    item: '<a href="https?://[^"]+" target="new" class="box-link".*?</figcaption>'
    name: '<h3 class="h4">([^<]+)</h3>'
    website: 'href="([^"]+)"'
    description: 'data-tooltip="([^"]*)"'
    locations: "Bengaluru, India"
  - id: prime-vp
    label: Prime Venture Partners portfolio
    url: https://www.primevp.in/portfolio
    item: '<a class="flex-center[^"]*" href="https?://[^"]+"[^>]*>\s*<img alt="[^"]+"'
    name: 'alt="([^"]+)"'
    website: 'href="([^"]+)"'
    locations: "India"
  - id: antler
    label: Antler portfolio (India tag)
    url: https://www.antler.co/portfolio
    item: '<div class="portco_card">.*?class="clickable_link'
    name: 'fs-cmsfilter-field="name"[^>]*>([^<]+)<'
    website: 'href="(https?://[^"]+)" class="clickable_link'
    description: 'fs-cmsfilter-field="description"[^>]*>([^<]+)<'
    keep: 'tag_small_text">India<'
    year: 'fs-cmsfilter-field="year"[^>]*>\s*<div[^>]*>(\d{4})<'
    locations: "India"
    pages: {param: "0b933bfd_page", max: 40}

funding:
  - id: inc42
    label: Inc42 Funding Galore (weekly)
    feed: https://inc42.com/tag/funding-galore/feed/
    index: https://inc42.com/tag/funding-galore/
    company_page: "https://inc42.com/company/{slug}/"     # the startup's profile, which links its website
    max_articles: 30
  - id: entrackr
    kind: entrackr                 # 2e: weekly reports found in Entrackr's daily sitemaps (robots.txt allows them)
    label: Entrackr weekly funding reports
    weeks: 12
# Entrackr's deals are prose with no websites: refill.parse_entrackr_deals reads the deal paragraphs (reviewed
# lists in data/entrackr_deals.json win), and a website is accepted only from a likely domain whose homepage
# names the company (with an India or sector signal) and has MX records.
# Skipped: YourStory (funding pages are script-rendered).

github_lists:
  - id: bangalore-startups
    repo: hemanth/bangalore-startups
    branch: master
    path: startups.json
    format: name_url_json
    locations: "Bengaluru, India"
  - id: ai-startups-india
    repo: rushout09/ai-startups-india
    branch: main
    path: README.md
    format: markdown_table
    locations: "India"
# Skipped: avinassh/dev-startups-india (names only, no websites; last updated 2021).
  - id: india-deeptech
    repo: rshetye/AwesomeIndiaStartups       # BSD-3-Clause (2f): Indian deep-tech startups (AI, security, IoT, ...)
    branch: main
    path: README.md
    format: header_table                     # | Company Name | Product Name | Product Brief | ... | website | ...
    license: BSD-3-Clause
    locations: "India"
# 2f: GitHub lists looked at and skipped: akshit-arora/software-applications-of-india (MIT; 7 large product
# companies), mdrayan001/100-Companies-15LPA-India (MIT; HTML cards with no company links, large companies),
# ankushdutt/intern-india-tech (no license; 2022 internship links to big-company career sites),
# vasanthkumar18/BestCompanies_India (Apache-2.0; large companies only). No public raw list of Indian
# product-engineering consultancies was found, so consultancies come from the seed list below.

# Phase 2f: fintech lists. Each company is resolved / verified on its own website (names it, India signal, MX);
# banks, cooperative banks, card networks and PSUs are never added.
fintech_lists:
  - id: rbi-nbfc
    kind: rbi                      # entity tables (Name of the NBFC ...), parsed by supply.parse_rbi_entities
    label: RBI - NBFC lists (Account Aggregators, P2P lending)
    url: https://www.rbi.org.in/Scripts/BS_NBFCList.aspx
    # 2026-10-27: www.rbi.org.in answers ApplyFlow's User-Agent with HTTP 418 on /robots.txt, so robots.txt
    # can't be read and the polite client won't fetch the list (website.rbi.org.in redirects there). The
    # payment-aggregator and payment-system-operator lists live on the same host and aren't configured until
    # their URLs can be confirmed under a readable robots.txt.
  - id: sahamati-aa
    kind: sahamati                 # the RBI-licensed Account Aggregators (NBFC-AA), as Sahamati lists them
    label: Sahamati - Account Aggregators
    url: https://sahamati.org.in/account-aggregators/
  - id: sahamati-tsp
    kind: sahamati
    label: Sahamati - technology service providers (AA ecosystem)
    url: https://sahamati.org.in/technology-service-provider/
  - id: face-members
    kind: sahamati                 # 2g: same shape - member logos linking each member's own website
    label: FACE (Fintech Association for Consumer Empowerment) - members
    url: https://www.faceofindia.org/members
    # 2g, looked at and skipped: Payments Council of India (our-members.html renders its list with JavaScript),
    # DLAI (dlai.in answers 404), Sahamati FIU / FIP pages (names only, mostly banks and NBFCs, no websites).


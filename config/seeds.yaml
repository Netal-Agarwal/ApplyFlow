# Seed companies and the applicant-tracking system (ATS) their job board runs on.
#
# Each entry needs:
#   name:  display name
#   ats:   greenhouse | lever | ashby
#   slug:  the board identifier in the ATS URL, e.g.
#            boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>
#
# Every board below was checked live on 2026-10-11. Boards move or close, so run
# `python -m applyflow verify-seeds` now and then; `python -m applyflow probe "Company"`
# finds the board for a new company and can add it here for you.
#
# This list leans towards companies with Indian offices or remote roles. Big
# companies mostly list experienced roles, so expect most of their postings to be
# filtered out - that's the filters working, not a bug.

companies:
